  # ── V2-A3 Fixed-Size Leaf + V2-A1 Threshold Sweep ─────────────────────────

  - id: EXP-karatsuba-zbc-leaf-fixed
    date: 2026-05-15
    hypothesis: >
      Fixed-size leaf functions with assign-on-first-write discipline
      (clmul_leaf_n8: 64 clmul64, clmul_leaf_n9: 81 clmul64) eliminate
      memset overhead in the schoolbook leaf multiplier.  Combined with a
      threshold sweep T∈{4,8,16}, the best configuration should reduce
      vect_mul HQC-128 instret below the champion baseline of 283,686.
      Later refined to hybrid form (row-0 unrolled + compact inner loops)
      for I-cache efficiency on in-order cores (−3.5% HW cycles at L128).
    status: promoted_to_stable
    promoted_date: 2026-05-15
    verdict: >
      WINNER — T=16 with clmul_leaf_n8 dispatch: 274,566 instret (−9,120,
      −3.21% vs baseline 283,686). T=8: 312,396 (worse — extra recursion
      overhead dominates). T=4: 409,104 (worse). Fixed-size n=8 leaf at the
      natural T=16 base case captures all the branch-elimination gain without
      adding recursion depth. Promoted to src/mult/karatsuba_zbc/.
      Pre-promotion archive at experiments/archive_karatsuba_zbc_pre_leaffixed/.
      Later: hybrid loop form (row-0 unrolled + compact loops for rows 1..n-1)
      measured −3.5% HW cycles at L128, −6.6% at L192 vs full unroll despite
      +8% instret — I-cache benefit dominates on the in-order X60.
    path: experiments/promoted/EXP-karatsuba-zbc-leaf-fixed
    promoted_to: src/mult/karatsuba_zbc/gf2x_clmul.c
    hardware_class: scalar_zbc
    cmake_variant: karatsuba_zbc_exp
    cmake_flag: -DHQC_KARATSUBA_THRESHOLD=16
    baseline_polymul_instructions_l128: 283686
    tracks: [V2-A3, V2-A1]
    metrics:
      level_128:
        polymul_instructions_t4: 409104
        polymul_instructions_t8: 312396
        polymul_instructions_t16: 274566
        winning_threshold: 16
        delta_instret: -9120
        delta_percent: -3.21
      measured: 2026-05-15
      tool: spike
      isa: rv64gcv_zbc_zbb_zbkb_zvbc_zicntr_zihpm

