  - id: EXP-keccak-zvbb-x2-soa
    date: 2026-06-30
    hypothesis: >
      2-way SoA vectorized Keccak-f[1600] using Zvbb (vror.vx, vandn.vv) and
      LMUL=8 vrgather.vv for Pi permutation.  Hypothesis: vector parallelism
      across two independent SHAKE contexts outperforms scalar rori-based Keccak.
    status: archived
    verdict: >
      Archived after hardware evaluation (BPI-F3, SpacemiT X60, VLEN=256)
      showed vectorized Keccak cannot outperform scalar+Zbb on in-order
      dual-issue cores.  LMUL=8 vrgather: 8.1× slower (CPI=16.9).
      LMUL=1 SoA vl=2: 2.3× slower than two sequential scalar calls.
      The scalar Zbb path (rori + andn idiom recognition) remains optimal.
      Previously located at src/keccak/fips202_zvbb_x2.c.
    path: experiments/dropped/EXP-keccak-zvbb-x2-soa
    hardware_class: crypto_vector_zvbb
    tracks: [AP-4]
    target_levels: [HQC-128, HQC-192, HQC-256]
