  - id: EXP-decode-rs-zvbc
    date: 2026-05-22
    hypothesis: >
      Vectorise Berlekamp-Massey ELP inner loops (Axis B) and Forney error-value
      inner loops (Axis D) using Zvbc vclmul.vv lane-packing and inline GF(2^8)
      Barrett reduction, eliminating the scalar gf_reduce overhead that accounts
      for ~8.85% of total KEM-128 instructions.
    status: promoted_to_stable
    promoted_date: 2026-05-22
    promoted_to: src/decode/reed_solomon_zvbc.c
    verdict: >
      Promoted after 300/300 KAT pass. decaps improvements: HQC-128 -36,106
      (-6.9%), HQC-192 -39,982 (-3.5%), HQC-256 -134,998 (-7.3%). Keypair and
      encaps unchanged, confirming clean decode isolation.
    path: experiments/promoted/EXP-decode-rs-zvbc
    hardware_class: crypto_vector_zvbc
    tracks: [AP-3]
    baseline_decode_impl: rvv
    target_levels: [HQC-128, HQC-192, HQC-256]

