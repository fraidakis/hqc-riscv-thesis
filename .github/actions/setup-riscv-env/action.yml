name: Setup RISC-V Environment
description: Install system dependencies and configure system-provided RISC-V toolchain

inputs:
  additional-packages:
    description: 'Additional APT packages to install (space-separated)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        base_packages="cmake ninja-build device-tree-compiler python3 libboost-regex-dev libboost-system-dev build-essential bison flex texinfo gawk"
        riscv_packages="clang-18 lld-18 gcc-riscv64-unknown-elf libnewlib-riscv64-unknown-elf libc6-dev-riscv64-cross qemu-user"
        additional="${{ inputs.additional-packages }}"
        if ! sudo apt-get install -y $base_packages $riscv_packages $additional; then
          echo "::warning:: libnewlib-riscv64-unknown-elf unavailable; retrying with picolibc-riscv64-unknown-elf"
          riscv_packages_fallback="clang-18 lld-18 gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf libc6-dev-riscv64-cross qemu-user"
          sudo apt-get install -y $base_packages $riscv_packages_fallback $additional
        fi

    - name: Provide unversioned LLVM binary aliases
      shell: bash
      run: |
        sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
        sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
        sudo ln -sf /usr/bin/lld-18 /usr/bin/lld
        sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld
        sudo ln -sf /usr/bin/llvm-ar-18 /usr/bin/llvm-ar
        sudo ln -sf /usr/bin/llvm-ranlib-18 /usr/bin/llvm-ranlib
        sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/bin/llvm-objcopy
        sudo ln -sf /usr/bin/llvm-objdump-18 /usr/bin/llvm-objdump
        sudo ln -sf /usr/bin/llvm-strip-18 /usr/bin/llvm-strip

    - name: Normalize bare-metal sysroot layout
      shell: bash
      run: |
        set -euo pipefail

        target_sysroot="/usr/riscv64-unknown-elf"
        sudo mkdir -p "$target_sysroot"

        # Ensure include path expected by toolchain flags exists.
        if [[ ! -f "$target_sysroot/include/string.h" ]]; then
          include_candidates=(
            "/usr/riscv64-unknown-elf/include"
            "/usr/include/newlib"
            "/usr/lib/riscv64-unknown-elf/newlib/include"
            "/usr/lib/newlib/include"
          )
          for inc in "${include_candidates[@]}"; do
            if [[ -f "$inc/string.h" ]]; then
              sudo ln -sfn "$inc" "$target_sysroot/include"
              break
            fi
          done
        fi

        # Ensure library path expected by toolchain flags exists.
        if [[ ! -f "$target_sysroot/lib/libc.a" ]]; then
          lib_candidates=(
            "/usr/riscv64-unknown-elf/lib"
            "/usr/lib/riscv64-unknown-elf/newlib"
            "/usr/lib/riscv64-unknown-elf"
            "/usr/lib/newlib"
          )
          for libdir in "${lib_candidates[@]}"; do
            if [[ -f "$libdir/libc.a" ]]; then
              sudo ln -sfn "$libdir" "$target_sysroot/lib"
              break
            fi
          done
        fi

        if [[ ! -f "$target_sysroot/include/string.h" ]]; then
          echo "::error:: Unable to locate bare-metal C headers (string.h) for riscv64-unknown-elf"
          exit 1
        fi
        if [[ ! -f "$target_sysroot/lib/libc.a" ]]; then
          echo "::error:: Unable to locate bare-metal C library (libc.a) for riscv64-unknown-elf"
          exit 1
        fi

        echo "::notice:: Normalized sysroot include: $(readlink -f "$target_sysroot/include")"
        echo "::notice:: Normalized sysroot lib: $(readlink -f "$target_sysroot/lib")"

    - name: Source toolchain environment and persist
      shell: bash
      run: |
        export RISCV="/usr"
        if [[ ! -x "$RISCV/bin/clang" ]]; then
          echo "::error:: RISC-V toolchain not found at RISCV=$RISCV"
          echo "::error:: Expected compiler: $RISCV/bin/clang"
          exit 1
        fi

        echo "RISCV=$RISCV" >> "$GITHUB_ENV"
        echo "$RISCV/bin" >> "$GITHUB_PATH"

        echo "::notice:: RISC-V toolchain configured: RISCV=$RISCV"
        echo "::notice:: clang: $(which clang)"
