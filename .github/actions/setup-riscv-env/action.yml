name: Setup RISC-V Environment
description: Install system dependencies, restore toolchain cache, build if needed, and source environment

inputs:
  cache-key-suffix:
    description: 'Optional suffix for cache key (e.g., matrix values)'
    required: false
    default: ''
  additional-packages:
    description: 'Additional APT packages to install (space-separated)'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'Whether the toolchain cache was hit'
    value: ${{ steps.restore-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        base_packages="cmake ninja-build device-tree-compiler python3 libboost-regex-dev libboost-system-dev build-essential bison flex texinfo gawk"
        additional="${{ inputs.additional-packages }}"
        sudo apt-get install -y $base_packages $additional

    - name: Restore toolchain cache
      id: restore-cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/riscv-tools
        key: riscv-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/toolchain.env') }}

    - name: Build LLVM toolchain from source (cache miss fallback)
      shell: bash
      run: |
        if [[ "${{ steps.restore-cache.outputs.cache-hit }}" != "true" ]]; then
          echo "::notice:: Toolchain cache miss. Building LLVM from source..."
          export RISCV="${{ github.workspace }}/riscv-tools"
          mkdir -p "$RISCV"
          
          # Clone riscv-gnu-toolchain if not present
          if [[ ! -d "${{ github.workspace }}/riscv-gnu-toolchain" ]]; then
            echo "::info:: Cloning riscv-gnu-toolchain repository..."
            git clone --depth=1 https://github.com/riscv-collab/riscv-gnu-toolchain.git "${{ github.workspace }}/riscv-gnu-toolchain" 2>&1 | tail -5 || {
              echo "::warning:: Could not clone riscv-gnu-toolchain; attempting to use local scripts..."
              export SRCDIR="${{ github.workspace }}"
            }
          fi
          
          # Build LLVM using local build script or riscv-gnu-toolchain
          if [[ -f "toolchain/build-llvm.sh" ]]; then
            echo "::info:: Executing toolchain/build-llvm.sh..."
            export RISCV="${{ github.workspace }}/riscv-tools"
            bash toolchain/build-llvm.sh 2>&1 | tail -20
          else
            echo "::error:: Could not find toolchain/build-llvm.sh"
            exit 1
          fi
          
          # Verify build
          if [[ ! -x "$RISCV/bin/clang" ]]; then
            echo "::error:: LLVM build failed or clang not found at $RISCV/bin/clang"
            exit 1
          fi
          echo "::notice:: LLVM build completed successfully."
        fi

    - name: Source toolchain environment and persist
      shell: bash
      run: |
        # Export RISCV path for this action and subsequent steps
        export RISCV="${{ github.workspace }}/riscv-tools"
        
        # If $RISCV doesn't have toolchain, try fallbacks from toolchain.env search
        if [[ ! -x "$RISCV/bin/clang" ]] && [[ -f "toolchain/toolchain.env" ]]; then
          echo "::debug:: Primary RISCV path not found; sourcing toolchain.env for fallback detection..."
          source toolchain/toolchain.env
        fi
        
        # Verify toolchain exists
        if [[ ! -x "$RISCV/bin/clang" ]]; then
          echo "::error:: RISC-V toolchain not found at RISCV=$RISCV"
          echo "::error:: Expected compiler: $RISCV/bin/clang"
          exit 1
        fi
        
        # Persist environment variables for subsequent steps and jobs
        echo "RISCV=$RISCV" >> "$GITHUB_ENV"
        echo "$RISCV/bin" >> "$GITHUB_PATH"
        
        echo "::notice:: RISC-V toolchain configured: RISCV=$RISCV"
        echo "::notice:: clang: $(which clang)"
