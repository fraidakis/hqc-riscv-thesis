name: Setup RISC-V Environment
description: Install system dependencies, restore toolchain cache, and source environment

inputs:
  cache-key-suffix:
    description: 'Optional suffix for cache key (e.g., matrix values)'
    required: false
    default: ''
  additional-packages:
    description: 'Additional APT packages to install (space-separated)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        base_packages="cmake ninja-build device-tree-compiler python3 libboost-regex-dev libboost-system-dev"
        additional="${{ inputs.additional-packages }}"
        sudo apt-get install -y $base_packages $additional

    - name: Restore toolchain cache
      uses: actions/cache@v4
      with:
        path: ~/Thesis/installed-tools
        key: riscv-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/toolchain.env') }}

    - name: Restore toolchain cache (new layout fallback)
      uses: actions/cache@v4
      with:
        path: ~/Thesis/toolchains/installed-tools
        key: riscv-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/toolchain.env') }}-toolchains-layout

    - name: Source toolchain environment
      shell: bash
      run: |
        source toolchain/toolchain.env
        if [[ ! -x "$RISCV/bin/clang" ]]; then
          echo "RISC-V toolchain not found at RISCV=$RISCV" >&2
          echo "Expected compiler: $RISCV/bin/clang" >&2
          exit 1
        fi
        echo "RISCV=$RISCV" >> "$GITHUB_ENV"
        echo "PATH=$RISCV/bin:$PATH" >> "$GITHUB_ENV"
