name: Opcode Verification

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'scripts/report/**'
      - 'results/**'
      - 'experiments/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'scripts/report/**'
      - 'results/**'
      - 'experiments/**'

jobs:
  verify-opcodes:
    name: Verify vclmul / clmul opcodes
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup RISC-V environment and toolchain
        uses: ./.github/actions/setup-riscv-env
        with:
          additional-packages: 'clang-tidy'

      - name: Build vector_zvbc target
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/riscv-gcc.cmake
          cmake --build build --target hqc128_vector_zvbc -j$(nproc)

      - name: Check vclmul opcodes present
        run: |
          bash scripts/ci/check_opcodes.sh \
            "$RISCV/bin/llvm-objdump" \
            build/hqc128_vector_zvbc.elf

      - name: Check ISA string in ELF
        run: |
          bash scripts/ci/check_isa_string.sh \
            build/hqc128_vector_zvbc.elf

      - name: Upload objdump log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: objdump-opcodes
          path: build/*.objdump.txt
