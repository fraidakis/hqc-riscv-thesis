name: Constant-Time Verification (DISABLED)

# ═══════════════════════════════════════════════════════════════════════════════
# STATUS: DISABLED — This workflow is retained for reference but does not
# provide meaningful coverage of the optimized RISC-V variants.
#
# PROBLEM SUMMARY:
#   1. All RISC-V-specific variants (scalar_zb, vector_rvv, vector_zvk, etc.)
#      use RISC-V intrinsics (__riscv_clmul_64, <riscv_vector.h>) that cannot
#      compile on x86-64. The script skips them with exit 0.
#   2. The only variant that actually runs (scalar_ref, vector_ref) is the
#      upstream vendor reference code — verifying it adds no new information.
#   3. Valgrind's RISC-V backend (v3.25.0+) does not yet support Zbc or RVV
#      instructions, so native on-target execution is also not possible.
#
# CONSEQUENCE: CT verification relies exclusively on:
#   - Architectural Zkt analysis (all instructions are data-independent timing)
#   - Empirical dudect measurement on BPI-F3 hardware
#
# FUTURE: A cross-compiled QEMU user-mode approach with riscv64-linux-gnu
# toolchain could enable Valgrind-based CT checks for the optimized variants.
# See tests/ct/README.md for implementation notes.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:   # manual-only — no longer triggered on push/PR


jobs:
  # ── Read the single source of truth for implemented variants ───────────────
  prepare:
    name: Read implemented variants
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.read.outputs.variants }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/parse-variants
        id: read

  # ── ctgrind: native Valgrind Memcheck for each (level × variant) ───────────
  # RISC-V-specific variants are automatically skipped by check_ct.sh (exit 0).
  ctgrind:
    name: "ctgrind — HQC-${{ matrix.level }} / ${{ matrix.variant }}"
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false   # surface all failures, not just the first
      matrix:
        level: [128, 192, 256]
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y valgrind libvalgrind-dev

      - name: Run ctgrind check
        run: bash scripts/ci/check_ct.sh ${{ matrix.level }} ${{ matrix.variant }}

      - name: Upload ctgrind report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ctgrind-hqc${{ matrix.level }}-${{ matrix.variant }}"
          path: results/ct_verify/valgrind_ct/ct_hqc${{ matrix.level }}_${{ matrix.variant }}_valgrind.xml
          if-no-files-found: ignore   # SKIP variants produce no report file

  # NOTE: dudect constant-time verification runs on hardware (BPI-F3)
  # using perf_event_open for cycle-accurate timing. It cannot run in CI.
  # See tests/ct_dudect/README.md for hardware execution instructions.
