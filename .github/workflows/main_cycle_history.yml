name: Main Branch Cycle History

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'scripts/report/**'
      - 'experiments/**'

jobs:
  prepare:
    name: Parse Implemented Variants
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.variants.outputs.variants }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/parse-variants
        id: variants

  spike-cycle-history:
    name: "Cycle History — ${{ matrix.variant }} / HQC-${{ matrix.level }}"
    runs-on: ubuntu-24.04
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        level: [128, 192, 256]
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-riscv-env

      - name: Restore Spike build cache
        uses: actions/cache@v4
        with:
          path: build/spike
          key: spike-bench-${{ runner.os }}-${{ matrix.level }}-${{ matrix.variant }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**', 'scripts/implemented_variants.txt') }}

      - name: Configure CMake for Spike benchmarks
        run: |
          cmake -S . -B build/spike -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/riscv-gcc.cmake \
            -DHQC_SIM=spike \
            -DBENCH_N_ITER=11

      - name: Build benchmark target for this variant
        run: |
          cmake --build build/spike \
            --target bench_polymul_hqc${{ matrix.level }}_${{ matrix.variant }} \
            -j"$(nproc)"

      - name: Run Spike and collect median cycle counts
        id: run-bench
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/simulation/benchmarks/main-history

          elf="build/spike/bench_polymul_hqc${{ matrix.level }}_${{ matrix.variant }}.elf"
          out="results/simulation/benchmarks/main-history/hqc${{ matrix.level }}_${{ matrix.variant }}_${GITHUB_SHA::8}.csv"

          sim/spike/run.sh --bench "$elf" | tee "$out"

          median=$(awk -F, '$1 == "vect_mul" { print $4; exit }' "$out")
          if [[ -z "$median" ]]; then
            echo "Failed to parse median_cycles for HQC-${{ matrix.level }} / ${{ matrix.variant }}" >&2
            exit 1
          fi
          echo "median=$median" >> "$GITHUB_OUTPUT"

      - name: Publish cycle history in job summary
        run: |
          {
            echo "## Spike Cycle History — HQC-${{ matrix.level }} / ${{ matrix.variant }}"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Run date (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Variant | ${{ matrix.variant }} |"
            echo "| Security Level | HQC-${{ matrix.level }} |"
            echo "| Median Cycles (vect_mul) | ${{ steps.run-bench.outputs.median }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "cycle-history-${{ matrix.variant }}-${{ matrix.level }}"
          path: results/simulation/benchmarks/main-history/
          if-no-files-found: warn

