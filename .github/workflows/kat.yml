name: KAT Vectors

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'scripts/report/**'
      - 'analysis/**'
      - 'experiments/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'scripts/report/**'
      - 'analysis/**'
      - 'experiments/**'

jobs:
  # ── Determine which variants are implemented ──────────────────────────────
  # Reads scripts/implemented_variants.txt as the single source of truth.
  # Add a variant name there once it is ready; CI picks it up automatically.
  #
  # Routing rules (applied here, not scattered across jobs):
  #   karatsuba_ref  → QEMU, but only after vendor submodule is initialised
  #                    (Phase 0a); excluded until then.
  #   fafft_zvbc     → Spike only (QEMU does not implement Zvbc).
  #   everything else → QEMU.
  setup:
    name: Detect implemented variants
    runs-on: ubuntu-24.04
    outputs:
      qemu-polymul:       ${{ steps.gen.outputs.qemu-polymul }}
      has-qemu-variants:  ${{ steps.gen.outputs.has-qemu-variants }}
      run-spike-zvbc:     ${{ steps.gen.outputs.run-spike-zvbc }}

    steps:
      - uses: actions/checkout@v5

      - name: Generate variant lists
        id: gen
        run: |
          mapfile -t all < <(grep -v '^\s*#\|^\s*$' scripts/implemented_variants.txt)

          qemu=()
          spike_zvbc=false

          for v in "${all[@]}"; do
            case "$v" in
              fafft_zvbc)   spike_zvbc=true ;;
              karatsuba_ref) ;;   # excluded until Phase 0a (vendor submodule)
              *)            qemu+=("$v") ;;
            esac
          done

          if [ ${#qemu[@]} -eq 0 ]; then
            json="[]"
            has=false
          else
            csv=$(printf '"%s",' "${qemu[@]}"); csv="${csv%,}"
            json="[$csv]"
            has=true
          fi

          echo "qemu-polymul=$json"      >> "$GITHUB_OUTPUT"
          echo "has-qemu-variants=$has"  >> "$GITHUB_OUTPUT"
          echo "run-spike-zvbc=$spike_zvbc" >> "$GITHUB_OUTPUT"

  # ── QEMU KAT — all QEMU-compatible implemented variants ───────────────────
  kat:
    name: KAT (${{ matrix.polymul }} / HQC-${{ matrix.level }})
    runs-on: ubuntu-24.04
    needs: setup
    if: needs.setup.outputs.has-qemu-variants == 'true'

    strategy:
      fail-fast: false
      matrix:
        polymul: ${{ fromJSON(needs.setup.outputs.qemu-polymul) }}
        level:   [128, 192, 256]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build device-tree-compiler \
            python3 libboost-regex-dev libboost-system-dev

      - name: Restore toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/Thesis/installed-tools
          key: riscv-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/toolchain.env') }}

      - name: Source toolchain environment
        run: |
          source toolchain/toolchain.env
          echo "RISCV=$RISCV"          >> "$GITHUB_ENV"
          echo "PATH=$RISCV/bin:$PATH" >> "$GITHUB_ENV"
          echo "QEMU=$RISCV/bin/qemu-system-riscv64" >> "$GITHUB_ENV"

      - name: Configure CMake (KAT mode, ref keccak + ref decoder)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/riscv-clang.cmake \
            -DHQC_KECCAK_IMPL=ref \
            -DHQC_DECODE_IMPL=ref

      - name: Build KAT target
        run: |
          cmake --build build \
            --target hqc${{ matrix.level }}_${{ matrix.polymul }} \
            -j$(nproc)

      - name: Run KAT under QEMU
        run: |
          RSP="vendor/hqc-ref/KAT/hqc-${{ matrix.level }}/PQCkemKAT_$(
            case ${{ matrix.level }} in
              128) echo 2249;;
              192) echo 4481;;
              256) echo 7245;;
            esac).rsp"
          chmod +x tests/kat/run_kat.sh
          tests/kat/run_kat.sh \
            build/hqc${{ matrix.level }}_${{ matrix.polymul }} \
            "$RSP" \
            "$QEMU"

      - name: Upload QEMU console log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kat-log-${{ matrix.polymul }}-${{ matrix.level }}
          path: /tmp/hqc_kat_*.log

  # ── Spike KAT — fafft_zvbc (Zvbc upper-bound tier, Spike only) ─────────────
  kat-spike-zvbc:
    name: KAT-Spike (fafft_zvbc / HQC-${{ matrix.level }})
    runs-on: ubuntu-24.04
    needs: setup
    if: needs.setup.outputs.run-spike-zvbc == 'true'

    strategy:
      fail-fast: false
      matrix:
        level: [128, 192, 256]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build device-tree-compiler python3

      - name: Restore toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/Thesis/installed-tools
          key: riscv-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/toolchain.env') }}

      - name: Source toolchain environment
        run: |
          source toolchain/toolchain.env
          echo "RISCV=$RISCV"          >> "$GITHUB_ENV"
          echo "PATH=$RISCV/bin:$PATH" >> "$GITHUB_ENV"
          echo "SPIKE=$RISCV/bin/spike" >> "$GITHUB_ENV"

      - name: Configure CMake (KAT mode)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/riscv-clang.cmake \
            -DHQC_KECCAK_IMPL=ref \
            -DHQC_DECODE_IMPL=ref

      - name: Build KAT target (fafft_zvbc)
        run: |
          cmake --build build \
            --target hqc${{ matrix.level }}_fafft_zvbc \
            -j$(nproc)

      - name: Run KAT under Spike (--isa with Zvbc)
        run: |
          RSP="vendor/hqc-ref/KAT/hqc-${{ matrix.level }}/PQCkemKAT_$(
            case ${{ matrix.level }} in
              128) echo 2249;;
              192) echo 4481;;
              256) echo 7245;;
            esac).rsp"
          LOG=$(mktemp /tmp/hqc_spike_kat_XXXXXX.log)
          "$SPIKE" \
            --isa=rv64gcv_zbc_zbb_zbkb_zvbc \
            --log-commits \
            build/hqc${{ matrix.level }}_fafft_zvbc \
            > "$LOG" 2>&1 || true
          python3 tests/kat/kat_check.py \
            --actual "$LOG" \
            --rsp    "$RSP"  \
            --level  ${{ matrix.level }}
