name: CI Matrix Build And Analysis

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'scripts/report/**'
      - 'analysis/**'
      - 'experiments/**'
  pull_request:
    branches: [main]

jobs:
  prepare:
    name: Prepare Variant Matrix
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.variants.outputs.variants }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/parse-variants
        id: variants

      - name: Validate variant matrix JSON
        run: |
          variants='${{ steps.variants.outputs.variants }}'
          if [[ -z "$variants" ]] || [[ "$variants" == "null" ]]; then
            echo "::error:: Variant matrix is empty or invalid"
            echo "Output was: $variants"
            exit 1
          fi
          echo "::notice:: Variant matrix JSON validated: $variants"

  build-test-analyze:
    name: CI (${{ matrix.variant }} / HQC-${{ matrix.level }})
    runs-on: ubuntu-24.04
    needs: prepare
    strategy:
      # fail-fast: false ensures all matrix combinations run even if some fail
      # This allows better insight into which variants/levels pass or fail independently
      fail-fast: false
      matrix:
        level: [128, 192, 256]
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-riscv-env
        with:
          additional-packages: 'clang-tidy jq'

      - name: Restore QEMU build cache
        uses: actions/cache@v4
        with:
          path: build/qemu
          key: qemu-build-${{ runner.os }}-${{ matrix.level }}-${{ matrix.variant }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**', 'scripts/implemented_variants.txt') }}

      - name: Restore Spike build cache
        uses: actions/cache@v4
        with:
          path: build/spike
          key: spike-build-${{ runner.os }}-${{ matrix.level }}-${{ matrix.variant }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**', 'scripts/implemented_variants.txt') }}

      - name: Configure CMake for QEMU
        run: |
          cmake -S . -B build/qemu -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/riscv-clang.cmake \
            -DHQC_SIM=qemu

      - name: Configure CMake for Spike
        run: |
          cmake -S . -B build/spike -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/riscv-clang.cmake \
            -DHQC_SIM=spike \
            -DBENCH_N_ITER=1

      - name: Build variant targets
        run: |
          cmake --build build/qemu --target hqc${{ matrix.level }}_${{ matrix.variant }} -j$(nproc)
          cmake --build build/spike --target bench_hqc${{ matrix.level }}_${{ matrix.variant }} -j$(nproc)

      - name: KAT regression gate (ctest)
        run: ctest --test-dir build/qemu --output-on-failure

      - name: Static analysis (lint.sh)
        run: bash scripts/ci/lint.sh
        env:
          BUILD_DIR: build/qemu