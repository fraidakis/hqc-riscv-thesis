name: CI Matrix Build And Analysis

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  prepare:
    name: Prepare Variant Matrix
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.variants.outputs.variants }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse implemented variants
        id: variants
        run: |
          variants=$(grep -v '^#' scripts/implemented_variants.txt \
            | grep -v '^[[:space:]]*$' \
            | jq -Rnc '[inputs]')
          echo "variants=$variants" >> "$GITHUB_OUTPUT"

  build-test-analyze:
    name: CI (${{ matrix.variant }} / HQC-${{ matrix.level }})
    runs-on: ubuntu-24.04
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        level: [128, 192, 256]
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang-tidy jq python3 device-tree-compiler \
            libboost-regex-dev libboost-system-dev

      - name: Restore toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/Thesis/installed-tools
          key: riscv-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/toolchain.env') }}

      - name: Restore QEMU build cache
        uses: actions/cache@v4
        with:
          path: build/qemu
          key: qemu-build-${{ runner.os }}-${{ matrix.level }}-${{ matrix.variant }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**', 'scripts/implemented_variants.txt') }}

      - name: Restore Spike build cache
        uses: actions/cache@v4
        with:
          path: build/spike
          key: spike-build-${{ runner.os }}-${{ matrix.level }}-${{ matrix.variant }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**', 'scripts/implemented_variants.txt') }}

      - name: Source toolchain environment
        run: |
          source toolchain/toolchain.env
          echo "RISCV=$RISCV" >> "$GITHUB_ENV"
          echo "PATH=$RISCV/bin:$PATH" >> "$GITHUB_ENV"

      - name: Configure CMake for QEMU
        run: |
          cmake -S . -B build/qemu -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/riscv-clang.cmake \
            -DHQC_SIM=qemu

      - name: Configure CMake for Spike
        run: |
          cmake -S . -B build/spike -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/riscv-clang.cmake \
            -DHQC_SIM=spike \
            -DBENCH_N_ITER=1

      - name: Build variant targets
        run: |
          cmake --build build/qemu --target hqc${{ matrix.level }}_${{ matrix.variant }} -j$(nproc)
          cmake --build build/spike --target bench_hqc${{ matrix.level }}_${{ matrix.variant }} -j$(nproc)

      - name: KAT regression gate (ctest)
        run: ctest --test-dir build/qemu --output-on-failure

      - name: Static analysis (clang-tidy)
        run: |
          find src -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' \) -print0 \
            | xargs -0 -r clang-tidy \
              -p build/qemu \
              --checks='bugprone-*,cert-*' \
              --warnings-as-errors='bugprone-*,cert-*'